name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 解压并定位项目
        id: loc
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -oq "$z" -d _proj; fi
          done
          S=$(find . -name 'settings.gradle*' -not -path './.git/*' | head -1)
          echo "找到项目: $S"
          echo "dir=$(dirname "$S")" >> $GITHUB_OUTPUT

      - name: 构建 APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.loc.outputs.dir }}/**/build/outputs/apk/debug/*.apk
